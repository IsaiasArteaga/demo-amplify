<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola desde AWS Amplify</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #7c3aed, #ec4899);
      color: #1f2937;
    }

    .tarjeta {
      width: 100%;
      max-width: 560px;
      padding: 48px 32px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.15;
      margin-bottom: 20px;
      color: #312e81;
    }

    .version {
      display: inline-block;
      padding: 10px 24px;
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      border-radius: 999px;
    }

    p {
      margin-top: 24px;
      font-size: 1rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <h1>Hola desde AWS Amplify</h1>
    <div class="version">Versión 2</div>
    <p>Desplegado automáticamente desde GitHub</p>
  </main>
</body>
</html>
